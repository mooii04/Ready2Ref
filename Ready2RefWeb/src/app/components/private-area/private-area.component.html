<app-header-private></app-header-private>

<main class="r2r-main">
  <p *ngIf="userProfile">
    Bienvenido, {{ userProfile.nombre }} {{ userProfile.primerApellido }} {{ userProfile.segundoApellido }} a Ready2Ref
  </p>

  <div *ngIf="rol === 'ADMIN'" class="r2r-btn-group">
    <button class="r2r-btn-card" routerLink="/crear-arbitro">
      <span class="r2r-btn-icon"><i class="bi bi-person-plus-fill"></i></span>
      <span class="r2r-btn-title">Crear un árbitro</span>
    </button>
    <button class="r2r-btn-card" routerLink="/arbitros-registrados">
      <span class="r2r-btn-icon"><i class="bi bi-list-ul"></i></span>
      <span class="r2r-btn-title">Ver árbitros</span>
    </button>
    <button class="r2r-btn-card" routerLink="/crear-entrenador">
      <span class="r2r-btn-icon"><i class="bi bi-person-badge-fill"></i></span>
      <span class="r2r-btn-title">Crear entrenador</span>
    </button>
    <button class="r2r-btn-card" routerLink="/contrasenia">
      <span class="r2r-btn-icon"><i class="bi bi-key-fill"></i></span>
      <span class="r2r-btn-title">Cambiar contraseña</span>
    </button>
    <button class="r2r-btn-card" [routerLink]="['/vista-mensajes']">
      <span class="r2r-btn-icon"><i class="bi bi-envelope-fill"></i></span>
      <span class="r2r-btn-title">
        Ver mensajes
        <span *ngIf="mensajesNoLeidos > 0" class="badge">{{ mensajesNoLeidos }}</span>
      </span>
    </button>
    <button class="r2r-btn-card" routerLink="/create-mensajes">
      <span class="r2r-btn-icon"><i class="bi bi-chat-dots-fill"></i></span>
      <span class="r2r-btn-title">Crear mensaje</span>
    </button>
  </div>

  <div *ngIf="rol === 'USER'" class="r2r-btn-group">
    <button class="r2r-btn-card" routerLink="/user-edit">
      <span class="r2r-btn-icon"><i class="bi bi-person-fill"></i></span>
      <span class="r2r-btn-title">Editar datos</span>
    </button>
    <button class="r2r-btn-card" routerLink="/contrasenia">
      <span class="r2r-btn-icon"><i class="bi bi-key-fill"></i></span>
      <span class="r2r-btn-title">Cambiar contraseña</span>
    </button>
    <button class="r2r-btn-card" [routerLink]="['/vista-mensajes']">
      <span class="r2r-btn-icon"><i class="bi bi-envelope-fill"></i></span>
      <span class="r2r-btn-title">
        Ver mensajes
        <span *ngIf="mensajesNoLeidos > 0" class="badge">{{ mensajesNoLeidos }}</span>
      </span>
    </button>
  </div>

  <div *ngIf="rol === 'ENTRENADOR'" class="r2r-btn-group">
    <button class="r2r-btn-card" routerLink="/entrenador-edit">
      <span class="r2r-btn-icon"><i class="bi bi-person-fill"></i></span>
      <span class="r2r-btn-title">Editar datos</span>
    </button>
    <button class="r2r-btn-card" routerLink="/contrasenia">
      <span class="r2r-btn-icon"><i class="bi bi-key-fill"></i></span>
      <span class="r2r-btn-title">Cambiar contraseña</span>
    </button>
    <button class="r2r-btn-card" routerLink="/entrenamientos">
      <span class="r2r-btn-icon"><i class="bi bi-clipboard-data-fill"></i></span>
      <span class="r2r-btn-title">Subir entrenamientos</span>
    </button>
    <button class="r2r-btn-card" [routerLink]="['/vista-mensajes']">
      <span class="r2r-btn-icon"><i class="bi bi-envelope-fill"></i></span>
      <span class="r2r-btn-title">
        Ver mensajes
        <span *ngIf="mensajesNoLeidos > 0" class="badge">{{ mensajesNoLeidos }}</span>
      </span>
    </button>
  </div>
</main>
<app-footer></app-footer>
