<app-header-private></app-header-private>
<div class="entrenamientos-container">
  <h2>Subir entrenamiento</h2>
  <form (ngSubmit)="onUpload()">
    <input type="file" (change)="onFileSelected($event)" accept="application/pdf" />
    <button type="submit" [disabled]="loading || !selectedFile">Subir archivo</button>
  </form>

  <div *ngIf="loading">
    <span *ngIf="uploadProgress > 0">Subiendo: {{uploadProgress}}%</span>
    <span *ngIf="uploadProgress === 0">Subiendo archivo...</span>
  </div>
  <div *ngIf="error" class="error">{{ error }}</div>
  <div *ngIf="success" class="success">{{ success }}</div>

  <div *ngIf="fileResponse" class="file-info">
    <h3>Archivo subido:</h3>
    <ul>
      <li><strong>Nombre:</strong> {{fileResponse.name}}</li>
      <li><strong>Tamaño:</strong> {{fileResponse.size}} bytes</li>
      <li><strong>Tipo:</strong> {{fileResponse.type}}</li>
      <li>
        <strong>Descargar:</strong>
        <a [href]="'http://localhost:8080/download/' + fileResponse.id" target="_blank">Descargar PDF</a>
      </li>
    </ul>
  </div>
</div>
