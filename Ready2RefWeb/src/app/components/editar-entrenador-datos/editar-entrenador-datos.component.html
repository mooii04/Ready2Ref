<form [formGroup]="datosForm" (ngSubmit)="onSubmit()" class="entrenador-editar-form" *ngIf="!cargandoDatos">
  <h2>Editar datos personales (Entrenador)</h2>
  <label>
    Nombre:
    <input type="text" formControlName="nombre" required />
  </label>
  <label>
    Primer Apellido:
    <input type="text" formControlName="primerApellido" required />
  </label>
  <label>
    Segundo Apellido:
    <input type="text" formControlName="segundoApellido" required />
  </label>
  <label>
    Email:
    <input type="email" formControlName="email" required />
  </label>
  <label>
    Teléfono:
    <input type="text" formControlName="telefono" required />
  </label>
  <div class="entrenador-editar-botones">
    <button type="submit" [disabled]="loading">Guardar</button>
  </div>
  <div *ngIf="error" class="error">{{ error }}</div>
  <div *ngIf="success" class="success">{{ success }}</div>
</form>
<div *ngIf="cargandoDatos" class="cargando">Cargando datos...</div>
