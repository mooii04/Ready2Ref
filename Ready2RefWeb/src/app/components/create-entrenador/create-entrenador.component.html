<app-header-private></app-header-private>
<div class="create-entrenador-container">
  <h2>Crear entrenador</h2>
  <form [formGroup]="entrenadorForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <label>Nombre</label>
      <input formControlName="nombre" />
    </div>
    <div class="form-row">
      <label>Primer Apellido</label>
      <input formControlName="primerApellido" />
    </div>
    <div class="form-row">
      <label>Segundo Apellido</label>
      <input formControlName="segundoApellido" />
    </div>
    <div class="form-row">
      <label>Username</label>
      <input formControlName="username" />
    </div>
    <div class="form-row">
      <label>Email</label>
      <input formControlName="email" />
    </div>
    <div class="form-row">
      <label>Teléfono</label>
      <input formControlName="telefono" />
    </div>
    <div class="form-row">
      <label>Password</label>
      <input type="password" formControlName="password" />
    </div>
    <div class="form-row">
      <label>Verificar Password</label>
      <input type="password" formControlName="verifyPassword" />
    </div>
    <div class="form-actions">
      <button type="submit" [disabled]="loading">Crear Entrenador</button>
    </div>
    <div *ngIf="error" class="error">{{ error }}</div>
    <div *ngIf="success" class="success">{{ success }}</div>
  </form>
</div>
