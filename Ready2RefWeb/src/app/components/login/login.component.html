<div class="login-bg py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h2 class="text-center fw-bold mb-4" style="font-size:2.5rem;">Iniciar Sesión</h2>
        <div class="card border-0 shadow-sm p-4">
          <form [formGroup]="loginForm" (ngSubmit)="login()">
            <div class="mb-3">
              <label for="username" class="form-label fw-bold">Username</label>
              <input type="text" id="username" class="form-control login-input" formControlName="username" placeholder="Introduce tu username">
              <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="text-danger small">
                El usuario es obligatorio.
              </div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label fw-bold">Contraseña</label>
              <input type="password" id="password" class="form-control login-input" formControlName="password" placeholder="Introduce tu contraseña">
              <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger small">
                La contraseña es obligatoria.
              </div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn login-btn" [disabled]="loginForm.invalid">Iniciar Sesión</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
