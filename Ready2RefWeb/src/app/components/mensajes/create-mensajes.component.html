<app-header-private></app-header-private>
<div class="create-mensaje-container">
  <h2>Crear mensaje</h2>
  <form [formGroup]="mensajeForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <label>Asunto</label>
      <input formControlName="asunto" />
    </div>
    <div class="form-row">
      <label>Contenido</label>
      <textarea formControlName="contenido" rows="4"></textarea>
    </div>
    <div class="form-actions">
      <button type="submit" [disabled]="loading">Enviar mensaje</button>
    </div>
    <div *ngIf="error" class="error">{{ error }}</div>
    <div *ngIf="success" class="success">{{ success }}</div>
  </form>
</div>
<app-footer></app-footer>
